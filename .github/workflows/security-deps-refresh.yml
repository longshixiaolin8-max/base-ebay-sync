name: Refresh Security Dependency Lock

on:
  push:
    branches:
      - codex/public-saas-readiness-20261003

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, '[security-deps-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-saas-readiness-20261003

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Validate production dependency graph
        run: |
          set -euo pipefail
          pnpm -r --if-present run lint
          pnpm -r --if-present run build
          pnpm -r --if-present run typecheck
          pnpm -r --if-present run test
          (cd infra && npx cdk synth --all --context githubRepo=${{ github.repository }} --context region=us-east-2 > /dev/null)
          pnpm audit --prod --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "::error::Lockfile did not change."
            exit 1
          fi
          git commit -m "[security-deps-refreshed] Refresh patched production dependencies"
          git push origin HEAD:codex/public-saas-readiness-20261003
