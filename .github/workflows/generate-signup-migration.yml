name: Generate Signup Migration

on:
  push:
    branches:
      - codex/public-saas-readiness-20261003

permissions:
  contents: write

jobs:
  generate:
    if: ${{ contains(github.event.head_commit.message, '[generate-signup-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/public-saas-readiness-20261003

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: pnpm --filter @ai-ec/db generate

      - name: Commit generated migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/migrations
          if git diff --cached --quiet; then
            echo "::error::Drizzle did not generate a migration."
            exit 1
          fi
          git commit -m "[migration-generated] Add signup verification table"
          git push origin HEAD:codex/public-saas-readiness-20261003
