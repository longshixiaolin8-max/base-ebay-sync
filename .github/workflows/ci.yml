name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Build
        run: pnpm -r --if-present run build

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: CDK synth (template validation only, no AWS credentials used)
        working-directory: infra
        run: npx cdk synth --all --context githubRepo=${{ github.repository }} --context region=us-east-2 > /dev/null

      # Informational only, not a merge gate -- this monorepo currently carries a real
      # baseline of transitive-dependency advisories (mostly Next.js/PostCSS) that need
      # their own dedicated upgrade-and-regression-test round, not a surprise CI failure
      # on an unrelated PR. Dependabot (.github/dependabot.yml) is what actually drives
      # fixing these over time; this step just keeps them visible in every run's log.
      - name: Dependency audit (informational, does not block)
        run: pnpm audit --audit-level=high || true
