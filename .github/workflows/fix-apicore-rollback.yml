name: One-off - Recover ApiCore stack from UPDATE_ROLLBACK_FAILED

# Temporary, one-off recovery workflow. AiEcPlatform-<env>-ApiCore got stuck in
# UPDATE_ROLLBACK_FAILED after an earlier failed deploy (the POST /signup route-throttle
# ordering bug, fixed in #42) failed to roll back cleanly. Earlier attempts in this
# workflow tried to call cloudformation:ContinueUpdateRollback directly (denied: not
# granted to the GitHub deploy role) and then tried manually chaining into CDK's
# cfn-exec role (also denied: that role's trust policy only trusts CDK's own deploy-role,
# not the raw GitHub Actions identity, as a direct AssumeRole principal). `cdk rollback`
# (built into the CDK CLI since v2) is the right tool for this: it goes through the exact
# same role-chaining machinery `cdk deploy` already uses successfully throughout this
# pipeline (GitHub role -> CDK bootstrap deploy-role -> cfn-exec-role, all handled
# internally by the CDK CLI's own credential-provider chain), rather than this workflow
# trying to replicate that chain by hand. Delete this file once it's served its purpose.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --if-present run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Inspect current stack status
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore" \
            --query "Stacks[0].{Status:StackStatus,Reason:StackStatusReason}" \
            --output table

      - name: cdk rollback
        working-directory: infra
        run: |
          set -euo pipefail
          npx cdk rollback "AiEcPlatform-${{ inputs.environment }}-ApiCore" \
            --context env=${{ inputs.environment }} \
            --context region=${{ vars.AWS_REGION }} \
            --force

      - name: Confirm final stack status
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore" \
            --query "Stacks[0].{Status:StackStatus,Reason:StackStatusReason}" \
            --output table
