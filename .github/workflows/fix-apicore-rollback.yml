name: One-off - Recover ApiCore stack from UPDATE_ROLLBACK_FAILED

# Temporary, one-off recovery workflow. AiEcPlatform-<env>-ApiCore got stuck in
# UPDATE_ROLLBACK_FAILED after an earlier failed deploy (the POST /signup route-throttle
# ordering bug, fixed in #42) failed to roll back cleanly. CloudFormation refuses any
# further update to a stack in this state until an explicit ContinueUpdateRollback call
# succeeds. Delete this file once it's served its purpose.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Inspect current stack status
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore" \
            --query "Stacks[0].{Status:StackStatus,Reason:StackStatusReason}" \
            --output table

      - name: Assume the CDK CloudFormation-execution role
        # cdk deploy itself performs every stack update through this role (far broader
        # permissions than the GitHub OIDC role carries directly, confirmed: that role was
        # just denied cloudformation:ContinueUpdateRollback) -- chaining into the same role
        # CDK already uses for every successful deploy in this pipeline. Standard CDK
        # default-qualifier bootstrap naming (this account's qualifier, "hnb659fds", is
        # already visible in every synth's own BootstrapVersion SSM parameter default); the
        # account id is not a secret -- it's printed in plain text in every stack ARN this
        # pipeline's own deploy logs already contain.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458818121046:role/cdk-hnb659fds-cfn-exec-role-458818121046-${{ vars.AWS_REGION }}
          aws-region: ${{ vars.AWS_REGION }}
          role-chaining: true
          # Confirmed live: the assume itself is allowed, but this action's default
          # session-tagging call (sts:TagSession) is not -- CDK's own cfn-exec role trust
          # policy wasn't written to expect a tagging caller. Skip it; plain AssumeRole is
          # all this one-off call needs.
          role-skip-session-tagging: true

      - name: Continue the stuck rollback
        run: |
          set -euo pipefail
          aws cloudformation continue-update-rollback \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore"
          echo "ContinueUpdateRollback requested; waiting for it to settle..."
          aws cloudformation wait stack-rollback-complete \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore" || true
          aws cloudformation describe-stacks \
            --stack-name "AiEcPlatform-${{ inputs.environment }}-ApiCore" \
            --query "Stacks[0].{Status:StackStatus,Reason:StackStatusReason}" \
            --output table
